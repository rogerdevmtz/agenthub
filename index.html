<!doctype html>
<html lang="es" class="dark [color-scheme:light] dark:[color-scheme:dark]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AgentHub | Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    try {
      document.documentElement.classList.toggle('dark', localStorage.getItem('agenthub-theme') !== 'light');
    } catch {}
  </script>
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="min-h-screen bg-[#f2f5fb] bg-[radial-gradient(ellipse_at_28%_0%,#fdfdff_0%,transparent_49%)] font-sans text-[#182131] antialiased dark:bg-[#0c0d0f] dark:bg-[radial-gradient(ellipse_at_27%_0%,#222528_0%,transparent_38%)] dark:text-[#f5f6f3]">
  <a id="skip-link" href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-xl focus:bg-lime-300 focus:px-4 focus:py-2 focus:text-black">Saltar al contenido</a>

  <svg class="absolute size-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- La diferencia entre azul y rojo permite teñir el acento y conservar los tonos neutros. -->
      <filter id="brand-dark" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values=".216 0 .784 0 0   -.004 0 1.004 0 0   .69 0 .31 0 0   0 0 0 1 0"/>
      </filter>
      <filter id="brand-light" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="-.474 0 .556 0 0   -.743 0 .833 0 0   .038 0 .06 0 0   0 0 0 1 0"/>
      </filter>
      <image id="brand-source" href="assets/roger-martinez.webp" width="272" height="91"/>
      <symbol id="brand-stacked" viewBox="0 0 60 56">
        <svg x="10" y="1" width="40" height="39" viewBox="15 15 58 57" overflow="hidden">
          <use href="#brand-source"/>
        </svg>
        <svg x="2" y="46" width="56" height="8" viewBox="82 35 174 24" overflow="hidden">
          <use href="#brand-source"/>
        </svg>
      </symbol>
    </defs>
  </svg>

  <aside class="fixed inset-x-0 bottom-0 z-20 flex border-t border-[#dce2ee] bg-[#f8faff] shadow-[0_6px_24px_#2637500e] dark:border-white/10 dark:bg-[#121416] dark:shadow-none sm:inset-x-auto sm:bottom-5 sm:left-3.5 sm:top-[17px] sm:w-[72px] sm:flex-col sm:rounded-[26px] sm:border">
    <a href="#dashboard" aria-label="Roger Martínez · Inicio de AgentHub" class="absolute left-1/2 top-3 hidden -translate-x-1/2 rounded-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-600 sm:block">
      <svg data-brand viewBox="0 0 60 56" class="block w-[60px] [filter:url(#brand-light)] dark:[filter:url(#brand-dark)]" aria-hidden="true"><use href="#brand-stacked"/></svg>
    </a>
    <nav id="navigation" aria-label="Secciones del panel" class="grid w-full grid-cols-6 gap-1 p-1.5 sm:flex sm:flex-col sm:items-center sm:gap-2.5 sm:p-0 sm:pt-[93px] sm:[@media(max-height:500px)]:gap-1 sm:[@media(max-height:500px)]:pt-[77px]"></nav>
  </aside>

  <div class="pb-24 sm:ml-[94px] sm:pb-10">
    <header class="relative isolate mx-auto grid max-w-[1620px] grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-5 px-4 pb-6 pt-3 sm:px-6 sm:pb-7 sm:pt-[86px] xl:px-8">
      <svg id="dashboard-accent" viewBox="0 0 800 150" preserveAspectRatio="none" class="pointer-events-none absolute bottom-0 right-[8%] -z-10 hidden h-[150px] w-[55%] overflow-hidden text-lime-500 opacity-50 [mask-composite:intersect] [mask-image:linear-gradient(to_right,transparent,black_28%,black_80%,transparent),linear-gradient(to_bottom,transparent,black_20%)] dark:text-[#bdff45] dark:opacity-80" aria-hidden="true">
        <defs>
          <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="currentColor" stop-opacity="0"/>
            <stop offset=".53" stop-color="currentColor" stop-opacity=".18"/>
            <stop offset="1" stop-color="currentColor" stop-opacity=".58"/>
          </linearGradient>
          <filter id="hero-glow" x="-20%" y="-60%" width="140%" height="220%">
            <feGaussianBlur stdDeviation="13"/>
          </filter>
          <path id="hero-curve" d="M0 160C110 159 171 146 270 131S443 122 541 85S663 21 716 -17"/>
        </defs>
        <use href="#hero-curve" fill="none" stroke="url(#hero-line)" stroke-width="20" filter="url(#hero-glow)"/>
        <use href="#hero-curve" fill="none" stroke="url(#hero-line)" stroke-width="1.15" vector-effect="non-scaling-stroke"/>
      </svg>
      <a href="#dashboard" aria-label="Roger Martínez · Inicio de AgentHub" class="shrink-0 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-lime-600 sm:hidden">
        <svg data-brand viewBox="0 0 60 56" class="block w-[54px] [filter:url(#brand-light)] dark:[filter:url(#brand-dark)]" aria-hidden="true"><use href="#brand-stacked"/></svg>
      </a>
      <div class="col-start-2 row-start-1 flex items-center gap-2 justify-self-end sm:gap-3">
        <div id="dashboard-period" hidden></div>
        <div class="group relative">
          <button id="theme-toggle" type="button" aria-pressed="true" aria-label="Modo oscuro" class="peer grid size-11 place-items-center rounded-xl border border-[#dce2ee] bg-[#f8faff] text-[#20293a] shadow-sm hover:border-lime-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-600 dark:border-white/10 dark:bg-[#1b1d20] dark:text-inherit dark:shadow-none dark:hover:border-lime-300 dark:focus-visible:outline-lime-300 sm:size-12"></button>
          <span id="theme-tooltip" aria-hidden="true" class="pointer-events-none absolute right-0 top-full z-30 mt-2 hidden whitespace-nowrap rounded-lg border border-[#dce2ee] bg-[#fcfdff] px-2.5 py-1.5 text-xs text-[#20293a] shadow-sm peer-focus-visible:block [@media(hover:hover)]:group-hover:block dark:border-white/15 dark:bg-[#222528] dark:text-[#f5f6f3]"></span>
        </div>
      </div>
      <div class="col-span-2 row-start-2 min-w-0 sm:col-span-1 sm:col-start-1 sm:row-start-1">
        <h1 id="heading" tabindex="-1" class="text-[30px] font-semibold leading-tight tracking-[-0.04em] outline-none sm:text-[34px]">Dashboard</h1>
        <p id="description" class="mt-1.5 text-sm leading-relaxed text-[#465065] dark:text-[#b5b8bf] sm:text-base"></p>
      </div>
    </header>

    <main id="contenido" tabindex="-1" class="mx-auto max-w-[1620px] px-4 outline-none sm:px-6 xl:px-8">
      <p id="announcement" class="sr-only" role="status"></p>
      <section id="view" aria-labelledby="heading"></section>
    </main>
  </div>

  <dialog id="record-dialog" aria-labelledby="dialog-title" class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-xl overflow-y-auto rounded-2xl border border-[#dce2ee] bg-[#fcfdff] p-0 text-[#182131] shadow-2xl backdrop:bg-[#23334b]/45 dark:border-white/15 dark:bg-[#191b1e] dark:text-[#f5f6f3] dark:backdrop:bg-black/65">
    <div id="dialog-panel"></div>
  </dialog>
</body>
</html>
